services:
  app:
    build: ./backend
    container_name: guides_app
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
    environment:
      PHP_CLI_SERVER_WORKERS: 4
    volumes:
      - ./backend:/var/www
      - vendor_data:/var/www/vendor
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: guides_db
    environment:
      MYSQL_DATABASE: guides_touristiques
      MYSQL_USER: guides
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3310:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: guides_phpmyadmin
    environment:
      PMA_HOST: db
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  db_data:
  vendor_data: