services:
  app:
    build: ./backend
    container_name: guides_app
    command: >
      sh -c "[ -f .env ] || cp .env.example .env;
      [ -f vendor/autoload.php ] || composer install --no-interaction --prefer-dist;
      grep -q '^APP_KEY=base64' .env || php artisan key:generate --force;
      until php artisan migrate --force; do echo 'En attente de MySQL...'; sleep 3; done;
      php artisan db:seed --force;
      php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "8000:8000"
    environment:
      PHP_CLI_SERVER_WORKERS: 4
    volumes:
      - ./backend:/var/www
      - vendor_data:/var/www/vendor
    depends_on:
      - db

  frontend:
    image: node:22-slim
    container_name: guides_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - node_modules_data:/app/node_modules
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: guides_db
    environment:
      MYSQL_DATABASE: guides_touristiques
      MYSQL_USER: guides
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3310:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: guides_phpmyadmin
    environment:
      PMA_HOST: db
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  db_data:
  vendor_data:
  node_modules_data: